# The pod pool on a Docker host, one container per pod. Run it together with
# stack.yaml and size the pool with --scale (keep POOL_SIZE in sandbox.env the
# same):
#
#   docker compose --env-file sandbox.env -f stack.yaml -f pool.yaml \
#     up -d --scale pod=4
#
# Every replica registers with the manager at start and is identified by the
# pod token it gets, and has its own anonymous HOME volume, so no pause
# container, shared volume or generated file is needed. One user (1001:2000) runs the supervisor,
# the daemon and the agents; see "The pod" in SANDBOX.md.
services:
  pod:
    image: ${POOL_IMAGE:-multica-sandbox-pool:0.7.0}
    user: "1001:2000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: always
    environment:
      POD_POLL_INTERVAL: 2s
    networks: [pods]
    # The only writable area: HOME, with every per-task location (/tmp in the
    # image points into it). The anonymous volume keeps the image's ownership
    # (1001:2000) and is removed with the container (docker compose down -v).
    volumes:
      - /home/pod
    # Without a limit a fork bomb in a task fills the host's process table.
    deploy: {resources: {limits: {cpus: "4", memory: 8G, pids: 1024}}}
