# The pool manager for a plain Docker host (a VM without Kubernetes), the
# counterpart of pool/k8s/manager.yaml. The pods come from pool.yaml; run
# both files together (see README.md):
#
#   docker compose --env-file sandbox.env -f stack.yaml -f pool.yaml \
#     up -d --scale pod=4
#
# The network alias is the in-cluster name the pool image has baked in
# (Dockerfile.pool ARGs), so the same image runs here unchanged.
name: multica-sandbox

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  manager:
    <<: *hardening
    image: ${MANAGER_IMAGE:-multica-sandbox-manager:0.7.0}
    user: "65532:65532"
    environment:
      SANDBOX_MANAGER_LISTEN: ":8080"
      SANDBOX_POOL_ADMIN_LISTEN: "127.0.0.1:8791" # inside the container only: docker compose exec manager wget -qO- http://127.0.0.1:8791/v1/inventory
      SANDBOX_POOL_SIZE: "${POOL_SIZE:-4}"
      MULTICA_SERVER_URL: ${MULTICA_SERVER_URL:?}
      SANDBOX_POOL_TOKEN_FILE: ${SECRETS_MOUNT:-/run/secrets}/pool-token
      SANDBOX_AUDIT_FILE: "-"
      SANDBOX_PROVIDERS: ${PROVIDERS:-claude,opencode}
      # Models the agent picker offers until a pod reports its own; see POOL.md.
      SANDBOX_MODELS: ${SANDBOX_MODELS:-}
      # Per-workspace overrides, keyed by workspace slug, read again on every
      # sync and on `docker compose kill -s HUP manager`. Edit the file in
      # place; no restart needed. See overrides.yaml.example.
      SANDBOX_WORKSPACE_OVERRIDES_FILE: /etc/sandbox-manager-overrides/overrides.yaml
    secrets: [pool-token]
    volumes:
      # A directory, so an editor that replaces the file is still seen.
      - ${OVERRIDES_DIR:-./overrides}:/etc/sandbox-manager-overrides:ro
    networks:
      pods:
        aliases: [sandbox-manager.multica-sandbox.svc.cluster.local]
      egress: {}
    deploy: {resources: {limits: {cpus: "1", memory: 512M}}}

secrets:
  # A file the operator creates, outside the repository, readable by uid 65532.
  pool-token: {file: "${SECRETS_DIR:-./secrets}/pool-token"}

networks:
  # Pods and manager. Set internal: true to cut the pods off from everything
  # else; then whatever the agents' custom environment points at (LLM, git
  # host) and the package mirror must be reachable on this network too.
  pods:
    name: multica-sandbox
    internal: ${POD_NETWORK_INTERNAL:-false}
  # The manager's way out to Multica.
  egress: {}
