# Pool membership is enforced here: pod registration on the manager is open
# (ADR 0003), so only pool pods may reach its pod listener.
# The manager is matched by pod labels, so the rules follow its pod. External
# services keep ipBlock PLACEHOLDERs (set them in an overlay): the LLM endpoint
# and git host the agents' custom environment names, and the package mirror,
# are assumed to run outside this namespace. If one runs in this namespace,
# replace its ipBlock with a podSelector. The DNS rule assumes kube-dns in
# kube-system.
---
# Pool pods: deny everything, then allow the listed egress. No ingress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pool-pod-egress
  namespace: multica-sandbox
spec:
  podSelector:
    matchLabels:
      multica.io/sandbox-role: pool-pod
  policyTypes: [Ingress, Egress]
  ingress: [] # nothing connects to a pod; reset commands are polled, not pushed
  egress:
    # Manager pod listener only (never the admin port).
    - to:
        - podSelector:
            matchLabels:
              multica.io/sandbox-role: manager
      ports:
        - {protocol: TCP, port: 8080}
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # LLM endpoint and git host from the agents' custom environment (external
    # to this namespace)
    - to:
        - ipBlock: {cidr: 10.0.10.0/24} # PLACEHOLDER
      ports:
        - {protocol: TCP, port: 443} # PLACEHOLDER
    # Internal package mirror (external to this namespace)
    - to:
        - ipBlock: {cidr: 10.0.12.0/24} # PLACEHOLDER
      ports:
        - {protocol: TCP, port: 80} # PLACEHOLDER
        - {protocol: TCP, port: 443}
---
# Manager: the pod listener accepts only pool pods (the admin listener is
# loopback-bound and not reachable over the network). Egress is left open
# (Multica); tighten it in an overlay if your CNI allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manager-ingress
  namespace: multica-sandbox
spec:
  podSelector:
    matchLabels:
      multica.io/sandbox-role: manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              multica.io/sandbox-role: pool-pod
      ports:
        - {protocol: TCP, port: 8080}
