apiVersion: v1
kind: Service
metadata:
  name: multica-backend
spec:
  selector:
    app.kubernetes.io/name: multica-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multica-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multica-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/multica-ai/multica-backend:v0.6.4
          envFrom:
            - secretRef:
                name: multica-backend
            - configMapRef:
                name: multica-backend
                optional: true
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
