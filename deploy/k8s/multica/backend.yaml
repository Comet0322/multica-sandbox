apiVersion: v1
kind: Service
metadata:
  name: multica-backend
spec:
  selector:
    app.kubernetes.io/name: multica-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multica-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multica-backend
    spec:
      # The image runs as root by default; the server and its migrator are
      # static binaries that run as any user. Uploads go to /app/data, which
      # was already the container's own (lost with the pod), now an emptyDir.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: ghcr.io/multica-ai/multica-backend:v0.11.0
          envFrom:
            - secretRef:
                name: multica-backend
            - configMapRef:
                name: multica-backend
                optional: true
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
