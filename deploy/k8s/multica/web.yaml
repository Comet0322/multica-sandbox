apiVersion: v1
kind: Service
metadata:
  name: multica-web
spec:
  selector:
    app.kubernetes.io/name: multica-web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multica-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multica-web
    spec:
      # The image's files are world-readable, so any user runs it. Next.js
      # writes only its cache (.next/cache) and temporary files.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: ghcr.io/multica-ai/multica-web:v0.11.0
          env:
            - name: REMOTE_API_URL
              value: http://multica-backend:8080
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          ports:
            - containerPort: 3000
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: cache, mountPath: /app/apps/web/.next/cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
