apiVersion: v1
kind: Service
metadata:
  name: multica-web
spec:
  selector:
    app.kubernetes.io/name: multica-web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multica-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multica-web
    spec:
      containers:
        - name: web
          image: ghcr.io/multica-ai/multica-web:v0.6.4
          env:
            - name: REMOTE_API_URL
              value: http://multica-backend:8080
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          ports:
            - containerPort: 3000
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
