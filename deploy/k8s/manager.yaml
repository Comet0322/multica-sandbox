# Example Deployment of the manager in the namespace it creates its pods in,
# next to Multica (docs/DEPLOYMENT.md). Every PLACEHOLDER is set before use.
#
# Before applying it:
#   kubectl apply -f deploy/k8s/rbac.yaml -n <namespace>     # the service account
#   kubectl create secret generic sandbox-manager -n <namespace> \
#     --from-file=pool-token=<file holding the bot account's PAT>
#   kubectl create configmap sandbox-manager -n <namespace> \
#     --from-file=pod.yaml=deploy/k8s/pod.yaml \
#     --from-file=overrides.yaml=<your overrides file, may be empty>
#   kubectl apply -f deploy/k8s/manager.yaml -n <namespace>
#
# Run exactly one manager per namespace (replicas 1, strategy Recreate): two
# would act on the same pods. Never give the manager's own pod the label
# app.kubernetes.io/managed-by=sandbox-manager; the manager treats every pod
# carrying it as one of its own pods.
apiVersion: v1
kind: Service
metadata:
  name: sandbox-manager
  labels:
    app.kubernetes.io/name: sandbox-manager
spec:
  selector:
    app.kubernetes.io/name: sandbox-manager
  # Pods report their running tasks here even while the manager is not
  # ready (Multica unreachable, a revoked PAT).
  publishNotReadyAddresses: true
  ports:
    # The pod listener, which the pod template's SANDBOX_MANAGER_URL names.
    - name: pods
      port: 8080
      targetPort: pods
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-manager
  labels:
    app.kubernetes.io/name: sandbox-manager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-manager
    spec:
      # The service account from rbac.yaml: pods only (create, delete, get,
      # list, watch, patch). Its token is mounted into this pod only.
      serviceAccountName: sandbox-manager
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: manager
          image: registry.example.com/multica-sandbox-manager:0.8.0 # PLACEHOLDER: deploy/Dockerfile.manager
          imagePullPolicy: IfNotPresent
          env:
            - {name: MULTICA_SERVER_URL, value: "http://multica-backend:8080"}
            - {name: SANDBOX_POOL_TOKEN_FILE, value: /etc/sandbox-manager/secret/pool-token}
            - {name: SANDBOX_POD_TEMPLATE, value: /etc/sandbox-manager/config/pod.yaml}
            - {name: SANDBOX_WORKSPACE_OVERRIDES_FILE, value: /etc/sandbox-manager/config/overrides.yaml}
            # No KUBECONFIG: the in-cluster service account. The namespace is
            # the pod's own unless SANDBOX_NAMESPACE says otherwise.
            - {name: SANDBOX_RUNTIMES, value: "pool,clean"}
            - {name: SANDBOX_MAX_PODS, value: "10"} # PLACEHOLDER: the budget
            - {name: SANDBOX_WARM_PODS, value: "2"}
            - {name: SANDBOX_PROVIDERS, value: "claude,opencode"} # the image's agent CLIs
            - {name: SANDBOX_MANAGER_LISTEN, value: ":8790"}
            # Reach the admin API with kubectl port-forward.
            - {name: SANDBOX_POOL_ADMIN_LISTEN, value: "127.0.0.1:8791"}
            - {name: SANDBOX_AUDIT_FILE, value: "-"}
          ports:
            - {name: pods, containerPort: 8790}
          livenessProbe:
            httpGet: {path: /healthz, port: pods}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: pods}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: secret, mountPath: /etc/sandbox-manager/secret, readOnly: true}
            - {name: config, mountPath: /etc/sandbox-manager/config, readOnly: true}
            # With a personal kubeconfig instead of the service account, mount
            # it from a Secret (kubectl create secret generic
            # sandbox-manager-kubeconfig --from-file=config=<kubeconfig>), set
            # KUBECONFIG=/etc/sandbox-manager/kube/config, and set
            # serviceAccountName/automountServiceAccountToken back to the
            # namespace's defaults (no token needed):
            # - {name: kubeconfig, mountPath: /etc/sandbox-manager/kube, readOnly: true}
      volumes:
        - name: secret
          secret: {secretName: sandbox-manager, defaultMode: 0440}
        - name: config
          configMap: {name: sandbox-manager}
        # - name: kubeconfig
        #   secret: {secretName: sandbox-manager-kubeconfig, defaultMode: 0440}
