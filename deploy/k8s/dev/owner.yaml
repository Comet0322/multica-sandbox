# Stands in for the manager's own Deployment when the manager runs on the
# host (manager.sh, the e2e scenarios): with SANDBOX_POD_OWNER=
# deployment/sandbox-e2e-owner the pods it creates are owned by this, so
# deleting it has Kubernetes delete them. It runs nothing (no replicas).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-e2e-owner
  labels:
    app.kubernetes.io/name: sandbox-e2e-owner
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-e2e-owner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-e2e-owner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: idle
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 1m, memory: 1Mi}
            limits: {cpu: 10m, memory: 8Mi}
