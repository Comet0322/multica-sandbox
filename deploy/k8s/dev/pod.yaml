# The pod template the manager creates every pod from (SANDBOX_POD_TEMPLATE),
# for the dev namespace: the fake-agent image loaded into kind, and the
# manager running on the host. The manager sets the pod's name, labels,
# restart policy and pod token itself (see GLOSSARY.md, "Pod template").
apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/name: sandbox-pod
spec:
  # Without it the hostname is the pod's name, which agents print into what
  # reaches Multica. The manager sets this same value when a template has none.
  hostname: sandbox
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 2000
    fsGroup: 2000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: daemon
      image: multica-sandbox-pool:kube-fake
      imagePullPolicy: Never
      command: ["tini", "--", "multica-pod-entrypoint-kube"]
      env:
        # The manager on the host, as kind's pods reach it (the kind
        # network's gateway); run.sh writes the real address in.
        - name: SANDBOX_MANAGER_URL
          value: "@MANAGER_URL@"
      resources:
        requests: {cpu: 250m, memory: 256Mi}
        limits: {memory: 1Gi}
      livenessProbe:
        exec:
          command: ["curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:19514/health"]
        initialDelaySeconds: 30
        periodSeconds: 15
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      volumeMounts:
        - {name: home, mountPath: /home/pod}
  volumes:
    - name: home
      emptyDir: {sizeLimit: 5Gi}
