# Stands in for the operator's own credentials at the company, with only the
# rights known for certain there: creating, deleting and watching pods in the
# namespace, which is also all the manager needs. Whether the operator may
# create service accounts, roles or anything else is not known, so this
# account may not. up.sh writes a kubeconfig for it, which the manager uses.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-user
---
apiVersion: v1
kind: Secret
metadata:
  name: dev-user-token
  annotations:
    kubernetes.io/service-account.name: dev-user
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-user-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-user-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-user-pods
subjects:
  - kind: ServiceAccount
    name: dev-user
